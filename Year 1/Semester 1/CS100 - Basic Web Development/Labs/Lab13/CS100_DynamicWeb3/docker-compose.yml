services:
  web:
    image: nginx
    container_name: lab13
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:rw
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network

  php:
    image: php:8.3-fpm
    container_name: php-fpm
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:rw
    networks:
      - app-network
    
networks:
  app-network:
    driver: bridge
