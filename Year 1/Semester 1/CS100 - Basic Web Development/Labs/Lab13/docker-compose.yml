services:
  web:
    image: nginx:latest
    container_name: week13_web
    ports:
      - "8080:80"
    volumes:
      - ./web/:/var/www/html:rw
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app-network
  php:
    image: php:8.3-fpm
    container_name: week13_server
    volumes:
      - ./web/:/var/www/html:rw
    networks:
      - app-network

networks:
  app-network:
    driver: bridge