<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen on button</title>
</head>
<body>
    <button type="button" id="helloworld">click here!</button>
    <p id="msg">result...</p>
    <script>
        document.getElementById("helloworld").addEventListener("click", function () {
            document.getElementById("msg").innerHTML = "Hello World!"
        });
    </script>
</body>
</html>
