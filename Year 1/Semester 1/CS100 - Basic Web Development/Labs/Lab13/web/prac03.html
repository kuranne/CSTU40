<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function with button</title>
</head>
<body>
    <button type="button" onclick="showHelloWorld()">Click this!</button>
    <p id="msg">Result...</p>
    <script>
        function showHelloWorld() {
            document.getElementById("msg").innerHTML = "Hello WOrld!";
        }
    </script>
</body>
</html>
