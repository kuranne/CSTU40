<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET Method</title>
</head>

<body>
    <div class="container">
        <form action="/search" method="GET">
            <label>Keyword:</label>
            <input type="text" name="keyword">
            <button type="submit">Search</button> <!--All from forms to action-->
        </form>
    </div>
</body>

</html>

<!--GET: send via url-->
<!--POST: send under json or xml-->
