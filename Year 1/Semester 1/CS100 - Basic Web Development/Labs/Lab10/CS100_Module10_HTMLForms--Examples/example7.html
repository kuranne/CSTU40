<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap GET Form Example 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h3 class="mb-4">Search Courses</h3>

    <form action="/search" method="GET" class="row g-3">
      <div class="col-md-6">
        <label for="keyword" class="form-label">Keyword</label>
        <input type="text" class="form-control" id="keyword" name="keyword" placeholder="e.g. HTML">
      </div>

      <div class="col-md-6">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" name="category">
          <option value="web">Web Development</option>
          <option value="data">Data Science</option>
          <option value="ai">Artificial Intelligence</option>
        </select>
      </div>

      <div class="col-md-12">
        <label class="form-label d-block">Level</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="level" id="beginner" value="beginner">
          <label class="form-check-label" for="beginner">Beginner</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="level" id="advanced" value="advanced">
          <label class="form-check-label" for="advanced">Advanced</label>
        </div>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>
  </div>
</body>
</html>
