<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validate</title>
</head>
<body>
    <h3>HTML Form Validation Demo</h3>
    <form>
        <label for="test-text">Test:</label><br>
        <input type="text" pattern="[a-z0-9A-Z]+@[a-z0-9.-]+\.[a-z]{2,}$" required><br><br> <!-- Regular Expression -->
        <label>Email:</label><br>
        <input type="email" name="email" required>
        <small>Must be a valid email address</small><br><br>
        <label>Username (3–10 characters):</label><br>
        <input type="text" name="username" minlength="3" maxlength="10" required><br><br>

        <label>Password (at least one number):</label><br>
        <input type="password" name="password" pattern="(?=.*\d).{8,}" required>

        <small>At least 8 characters with (at least) a number</small>

        <br><br>

        <label>Age (18–100):</label><br>
        <input type="number" name="age" min="18" max="100" required><br><br>

        <label>Rating (0–5, step 0.5):</label><br>
        <input type="number" name="rating" min="0" max="5" step="0.5"><br><br>

        <input type="checkbox" name="terms" required>
        I agree to the Terms and Conditions<br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
