<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.css" rel="stylesheet">
    <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="field">
        <label for="text">text:</label>
        <input type="text"><br>
        <label for="password">password:</label>
        <input type="password"><br>
        <label for="radio">radio</label>
        <input type="radio"><br>
        <label for="checkbox">checkbox</label>
        <input type="checkbox"><br>
        <label for="dropdown">dropdown</label>
        <select name="dropdown" id=""></select><br>
        <label for="submit">submit</label>
        <input type="submit">
    </div>

    <fieldset>
        <legend>Personal infomations</legend>
        <div class="field">
            <label for="email">email:</label>
            <input type="email"><br>
            <label for="password">password:</label>
            <input type="password"><br>
            <label for="radio">gender:</label>
            <input type="radio" name="gender" value="female">female
            <input type="radio" name="gender" value="male">male<br>
            <label for="faculty">faculty</label>
            <select name="faculty" id="faculty-field">
                <option value="Science">Science</option>
                <option value="Law">Law</option>
                <option value="Medicine">Medicine</option>
            </select><br>
            <label for="bio">Bio:</label>
            <textarea name="bio" id="bio-field" rows="3" cols="30"></textarea><br>
            <label for="color">favorite color:</label>
            <input type="color" name="colors" id="color-field"><br>
            <label for="upload">upload</label>
            <input type="file" name="upload" id="upload-field"><br>
            <input type="checkbox" name="subscribe" id="subscribe-field">
            <label for="subscribe">Subscribe to News letter</label><br>
            <button type="submit">submit</button><button type="reset">reset</button><br>
        </div>
    </fieldset>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <h3>Student Registration</h3>

            <label>Full Name:</label><br>
            <input type="text" name="firstname" id="firstname" placeholder="firstname" required>
            <input type="text" name="lastname" id="lastname" placeholder="lastname" required><br><br>
            
            <label>Email:</label><br>
            <input type="email" name="email" placeholder="example@email.com" pattern="" required>
            <small>Must be a valid email address</small><br><br>
            
            <label>Password:</label><br>
            <input type="password" name="password" required><br><br>
            
            <label>Gender:</label><br>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female<br><br>
            
            <label for="birthday">Birthday:</label><br>
            <input type="date" name="birthday" id="birthday"><br><br>
        </fieldset>

        <br><br>

        <fieldset>
            <legend>Academic Information</legend>
            <label>Faculty:</label><br>
            <select name="faculty">
                <option>Science</option>
                <option>Engineering</option>
                <option>Arts</option>
            </select><br><br>
            <label>Bio:</label><br>
            <textarea name="bio" rows="3" cols="30"></textarea>
        </fieldset>

        <br><br>

        <fieldset>
            <legend>Preference</legend>
            <label>Favorite Color:</label>
            <input type="color" name="color" value="#0000ff"><br><br>
            <label>Upload Profile Picture:</label>
            <input type="file" name="profile"><br><br>
        </fieldset>
        <br><br>
        <input type="checkbox" name="newsletter">
        Subscribe to newsletter<br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
