services:
  web:
    image: nginx:latest
    container_name: ourfestival
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ourfestival_php
    networks:
      - appnet

  ourfestival_php:
    image: php:8.3-fpm
    container_name: ourfestival_php
    volumes:
      - ./:/var/www/html
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
